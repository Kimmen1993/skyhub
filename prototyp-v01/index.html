<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<style>
/* Layout: fullskärmskarta över plattan, instrumentpaneler dockade som i ett kontrolltorn.
   Medvetet ett enda mörkt tema – spelet ser likadant ut oavsett systeminställning. */
:root {
  --bg: #0b111b;
  --panel: #111927;
  --panel-2: #172132;
  --line: #24314a;
  --fg: #e3e9f2;
  --muted: #8a97ad;
  --amber: #ffb627;
  --amber-dim: #6b5216;
  --ok: #5fd38d;
  --warn: #ff9f43;
  --bad: #ff6b6b;
  --info: #6cc3ff;
  --font-ui: "B612", "Segoe UI", system-ui, sans-serif;
  --font-data: "B612 Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --r: 6px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; overflow: hidden; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: auto 1fr auto; }
#map { grid-row: 2; grid-column: 1 / 4; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#map.pan { cursor: grab; }

/* Toppfält */
#top {
  grid-row: 1; grid-column: 1 / 4; z-index: 5;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--font-data); font-weight: 700; letter-spacing: 0.22em; font-size: 14px; color: var(--amber); display: flex; align-items: baseline; gap: 8px; }
.brand small { color: var(--muted); letter-spacing: 0.05em; font-size: 10px; font-weight: 400; }
.stats { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat .k { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--font-data); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.v.neg { color: var(--bad); }
.stars { color: var(--amber); letter-spacing: 1px; }
.stars .off { color: var(--line); }
.chip { font-family: var(--font-data); font-size: 11px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--warn); color: var(--warn); white-space: nowrap; }
.speed { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.speed button { background: none; border: 0; padding: 6px 10px; font-family: var(--font-data); cursor: pointer; color: var(--muted); }
.speed button + button { border-left: 1px solid var(--line); }
.speed button[aria-pressed="true"] { background: var(--amber); color: #1a1406; font-weight: 700; }
.iconbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; cursor: pointer; font-family: var(--font-data); font-size: 12px; }
.iconbtn:hover { border-color: var(--muted); }
#panelToggle { display: none; }

/* Verktyg */
#tools {
  grid-row: 2; grid-column: 1; z-index: 4; align-self: start;
  margin: 10px 0 0 max(10px, env(safe-area-inset-left, 0px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 20px); overflow-y: auto; width: 172px;
}
.tgroup { display: flex; flex-direction: column; gap: 3px; }
.tgroup h3 { margin: 0 0 2px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.tool { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; }
.tool:hover { background: var(--panel-2); }
.tool[aria-pressed="true"] { border-color: var(--amber); background: var(--panel-2); }
.tool .code { font-family: var(--font-data); font-weight: 700; font-size: 11px; text-align: center; padding: 3px 0; border-radius: 3px; background: var(--bg); color: var(--amber); }
.tool .nm { font-size: 12px; line-height: 1.2; }
.tool .cost { display: block; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.tool.poor .cost { color: var(--bad); }

/* Sidopanel */
#panel {
  grid-row: 2; grid-column: 3; z-index: 4; align-self: stretch;
  margin: 10px max(10px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) 0;
  width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px 4px; cursor: pointer; color: var(--muted); font-size: 12px; border-bottom: 2px solid transparent; position: relative; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--amber); }
.tabs .badge { position: absolute; top: 5px; right: 8px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--amber); color: #1a1406; font-size: 10px; font-family: var(--font-data); line-height: 15px; }
.pbody { overflow-y: auto; padding: 12px; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.sec h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 400; display: flex; justify-content: space-between; }
.muted { color: var(--muted); }

/* Avgångstavla */
.fids { background: #07090d; border-radius: 4px; padding: 8px; font-family: var(--font-data); font-size: 11.5px; overflow-x: auto; }
.fids table { width: 100%; border-collapse: collapse; }
.fids th { text-align: left; color: var(--amber-dim); font-weight: 400; font-size: 9px; letter-spacing: 0.12em; padding: 0 4px 5px; }
.fids td { color: var(--amber); padding: 3px 4px; white-space: nowrap; border-top: 1px solid #141821; }
.fids td.dest { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
.fids .al { display: inline-block; width: 6px; height: 6px; border-radius: 1px; margin-right: 5px; vertical-align: 1px; }
.st-ok { color: var(--ok) !important; } .st-warn { color: var(--warn) !important; } .st-bad { color: var(--bad) !important; }
.st-info { color: var(--info) !important; } .st-muted { color: #5b6476 !important; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 3px 8px; font-size: 10px; letter-spacing: 0.08em; cursor: pointer; color: var(--muted); text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }

/* Kort */
.card { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); }
.card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .title { font-weight: 700; display: flex; align-items: center; gap: 7px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.btns { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1a1406; font-weight: 700; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.bar { height: 5px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.bar > i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; }
.kv .data { text-align: right; }
.kv .tot { border-top: 1px solid var(--line); padding-top: 4px; font-weight: 700; }

/* Kapacitetsmätare */
.meter { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; }
.meter .lbl { font-size: 12px; }
.meter .val { font-family: var(--font-data); font-size: 11px; color: var(--muted); text-align: right; }
.meter .bar { grid-column: 1 / 3; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.slider input { grid-column: 1 / 3; width: 100%; accent-color: var(--amber); }

.log { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
.log div { display: grid; grid-template-columns: 42px 1fr; gap: 6px; line-height: 1.35; }
.log .t { font-family: var(--font-data); color: var(--muted); font-size: 11px; }
.log .bad { color: #ffb3b3; } .log .good { color: #b8f0cd; } .log .event { color: #ffd38a; }

/* Inspektor, hint, toasts */
#inspect {
  position: fixed; z-index: 6; left: calc(196px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: 270px; background: var(--panel); border: 1px solid var(--amber-dim); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
}
#inspect .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }
#hint {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px));
  background: rgba(17,25,39,0.92); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12px; max-width: min(560px, calc(100% - 32px)); text-align: center; pointer-events: none;
}
#toasts { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); top: calc(100px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--info); border-radius: 6px; padding: 8px 12px; font-size: 12.5px; animation: tin 0.25s ease-out; }
.toast.bad { border-left-color: var(--bad); } .toast.good { border-left-color: var(--ok); } .toast.event { border-left-color: var(--warn); }
@keyframes tin { from { transform: translateY(-6px); opacity: 0.4; } }

/* Modal */
#modal { position: fixed; inset: 0; z-index: 10; background: rgba(5,8,14,0.72); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; user-select: text; }
.dialog h2 { margin: 0; font-family: var(--font-data); letter-spacing: 0.16em; color: var(--amber); font-size: 18px; }
.dialog h3 { margin: 6px 0 0; font-size: 13px; }
.dialog p, .dialog li { line-height: 1.55; color: #c9d2e0; margin: 0; max-width: 65ch; }
.dialog ul, .dialog ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.dialog textarea { width: 100%; min-height: 90px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-family: var(--font-data); font-size: 11px; padding: 8px; box-sizing: border-box; resize: vertical; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.menu .btn { padding: 10px; }
.road { display: flex; flex-direction: column; gap: 8px; }
.road div { display: grid; grid-template-columns: 54px 1fr; gap: 10px; }
.road b { font-family: var(--font-data); color: var(--amber); font-size: 11px; padding-top: 2px; }
.road .now b { color: var(--ok); }

/* Mobil / smal skärm */
@media (max-width: 760px) {
  #app { grid-template-rows: auto 1fr auto; }
  #map { grid-row: 2; }
  #top { gap: 8px 12px; }
  .brand small { display: none; }
  .stats { gap: 10px; order: 3; flex-basis: 100%; }
  .stat .v { font-size: 12.5px; }
  #panelToggle { display: inline-block; }
  #tools {
    grid-row: 3; grid-column: 1 / 4; margin: 0; width: auto; border-radius: 0; border-width: 1px 0 0;
    flex-direction: row; overflow-x: auto; overflow-y: hidden; max-height: none; gap: 12px;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .tgroup { flex-direction: row; gap: 4px; align-items: stretch; }
  .tgroup h3 { display: none; }
  .tool { grid-template-columns: 1fr; gap: 2px; width: 62px; justify-items: center; text-align: center; padding: 4px 2px; }
  .tool .nm { font-size: 9.5px; }
  .tool .nm .full { display: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; top: 40%; margin: 0; width: auto; border-radius: 12px 12px 0 0; z-index: 8; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #panel.closed { display: none; }
  #inspect { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: auto; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
  #hint { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 761px) { .tool .nm .short { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>

<div id="app">
  <header id="top">
    <div class="brand">SKYHUB <small>v0.1</small></div>
    <div class="stats" id="stats"></div>
    <div class="speed" id="speed" role="group" aria-label="Spelhastighet">
      <button type="button" data-speed="0" title="Paus (mellanslag)">II</button>
      <button type="button" data-speed="1" title="Normal (1)">1×</button>
      <button type="button" data-speed="3" title="Snabb (2)">3×</button>
      <button type="button" data-speed="8" title="Snabbast (3)">8×</button>
    </div>
    <button type="button" class="iconbtn" id="panelToggle">Tavla</button>
    <button type="button" class="iconbtn" id="menuBtn">Meny</button>
  </header>
  <canvas id="map" aria-label="Flygplatskarta"></canvas>
  <nav id="tools" aria-label="Bygg"></nav>
  <aside id="panel" class="closed">
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="board" aria-selected="true">Tavla</button>
      <button type="button" role="tab" data-tab="deals" aria-selected="false">Avtal</button>
      <button type="button" role="tab" data-tab="ops" aria-selected="false">Drift</button>
      <button type="button" role="tab" data-tab="report" aria-selected="false">Rapport</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>
<div id="hint" hidden></div>
<div id="inspect" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

<script src="js/content.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

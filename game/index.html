<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: helskärmsvärld. Tecknade paneler med mörk kontur: status uppe till vänster, kontroller uppe till höger,
   tidtabell/problem i en sidopanel, valt flygs turnaround nere till vänster. Medvetet ett enda ljust spel-tema. */
:root {
  --ink: #1d2433;
  --paper: #fffaf0;
  --paper-2: #f3ecdd;
  --sky: #8fd0f2;
  --coral: #e8634a;
  --sun: #f2b134;
  --teal: #2bb3a6;
  --mint: #6fd39b;
  --muted: #5d6779;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
.btn { font: 700 14px var(--font-display); padding: 8px 14px; cursor: pointer; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.btn.primary { background: var(--sun); }
.btn.danger { background: var(--coral); color: #fff; }
.btn[aria-pressed="true"] { background: var(--teal); color: #fff; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.pill { font: 600 12px var(--font-display); padding: 1px 9px; border-radius: 999px; border: 2px solid var(--ink); white-space: nowrap; }
.ok { background: var(--mint); } .warn { background: var(--sun); } .bad { background: var(--coral); color: #fff; } .info { background: #8fd0f2; } .muted { background: #d8dde6; }
.num { font-variant-numeric: tabular-nums; }

#hud { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 8px 14px; display: flex; flex-direction: column; gap: 4px; max-width: calc(100% - 24px); }
#hud h1 { margin: 0; font: 700 18px var(--font-display); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#hud h1 small { font: 600 14px var(--font-display); color: var(--muted); }
#hud .row { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; font-weight: 800; font-size: 13px; }

#ctrl { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 24px); }
.seg { display: flex; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); background: var(--paper); }
.seg button { border: 0; background: none; padding: 8px 10px; font: 700 13px var(--font-display); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sun); }

#side { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: 340px; display: flex; flex-direction: column; overflow: hidden; }
#side.closed { display: none; }
.tabs { display: flex; border-bottom: 3px solid var(--ink); }
.tabs button { flex: 1; border: 0; background: var(--paper-2); padding: 9px 4px; font: 700 14px var(--font-display); cursor: pointer; position: relative; }
.tabs button + button { border-left: 3px solid var(--ink); }
.tabs button[aria-selected="true"] { background: var(--paper); }
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: var(--coral); color: #fff; font-size: 12px; margin-left: 6px; border: 2px solid var(--ink); }
.pbody { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.frow { display: grid; grid-template-columns: 44px 1fr auto; gap: 2px 8px; align-items: center; padding: 7px 8px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); cursor: pointer; text-align: left; }
.frow:hover, .frow.sel { background: #fff3c4; }
.frow .tm { font: 700 15px var(--font-display); }
.frow .code { font-weight: 800; display: flex; gap: 6px; align-items: center; min-width: 0; }
.frow .code span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .sub { grid-column: 2 / 4; color: var(--muted); font-size: 12px; font-weight: 700; }
.sw { width: 10px; height: 10px; border-radius: 3px; border: 2px solid var(--ink); flex: none; }
.sec { font: 600 11px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.pcard { border: 2px solid var(--ink); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: #fff1ea; }
.pcard .t { font-weight: 800; }
.pcard .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.pcard .btn { padding: 5px 10px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }
.empty { color: var(--muted); font-weight: 700; padding: 8px; }

#card { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: 330px; max-width: calc(100% - 24px); max-height: calc(100% - 200px); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
#card h2 { margin: 0; font: 700 17px var(--font-display); display: flex; gap: 8px; align-items: center; }
#card .x { position: absolute; top: 6px; right: 10px; border: 0; background: none; font: 700 20px var(--font-display); cursor: pointer; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; font-weight: 700; }
.task .bar { grid-column: 1 / 3; height: 6px; border-radius: 3px; background: #e6e0d2; overflow: hidden; border: 1px solid #c9c1ae; }
.task .bar i { display: block; height: 100%; background: var(--teal); }
.task .why { color: var(--muted); font-size: 12px; text-align: right; }
.task.blocked .why { color: #b8432f; }
.task.done { opacity: 0.55; }
.causes { display: flex; gap: 4px; flex-wrap: wrap; }

#help { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 7px 14px; font-weight: 800; font-size: 13px; text-align: center; max-width: calc(100% - 24px); }
#help b { background: var(--sun); border: 2px solid var(--ink); border-radius: 6px; padding: 0 5px; }
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(520px, calc(100% - 24px)); }
.toast { padding: 8px 14px; font: 600 14px var(--font-display); text-align: center; animation: tin 0.25s ease-out; }
.toast.bad { background: #ffe3dc; } .toast.good { background: #e3f7ea; } .toast.event { background: #fff3c4; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0.4; } }
.bubble { position: fixed; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; font: 600 14px var(--font-display); cursor: pointer; white-space: nowrap; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); }
.bubble .ic { width: 26px; height: 26px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 700 16px var(--font-display); border: 2px solid var(--ink); animation: pulse 1s ease-in-out infinite; }
.bubble.car .ic { background: var(--sun); color: var(--ink); font-size: 11px; animation: none; }
.bubble.near { background: var(--sun); }
.bubble .txt { display: none; }
.bubble.near .txt, .bubble:hover .txt { display: inline; }
.honk { position: fixed; transform: translate(-50%, -100%) rotate(-6deg); font: 700 15px var(--font-display); padding: 3px 9px; background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.15); } }

#modal { position: fixed; inset: 0; background: rgba(29, 36, 51, 0.45); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; -webkit-user-select: text; user-select: text; }
.dialog h2 { margin: 0; font: 700 24px var(--font-display); }
.dialog h3 { margin: 4px 0 0; font: 700 16px var(--font-display); }
.dialog p, .dialog li { margin: 0; line-height: 1.55; max-width: 62ch; }
.dialog ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.dialog input, .dialog textarea { width: 100%; font: 700 18px var(--font-display); padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.dialog textarea { font: 12px ui-monospace, Menlo, monospace; min-height: 80px; }
.dialog .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-weight: 700; }
.kv .tot { border-top: 2px solid var(--ink); padding-top: 4px; }
.cbar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.cbar i { display: block; height: 12px; border-radius: 6px; border: 2px solid var(--ink); }

@media (prefers-reduced-motion: reduce) { .bubble .ic { animation: none; } .toast { animation: none; } }
@media (max-width: 760px) {
  #hud { padding: 6px 10px; } #hud h1 { font-size: 15px; } #hud .row { font-size: 12px; }
  #ctrl { top: auto; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); }
  #side { left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); width: auto; top: 30%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
  #card { bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
  #help { font-size: 11.5px; }
}
</style>

<canvas id="c" aria-label="Flygplatsen"></canvas>
<div id="hud" class="panel"></div>
<div id="ctrl">
  <div class="seg" id="speed" role="group" aria-label="Spelhastighet">
    <button type="button" data-speed="0" title="Paus (P)">II</button>
    <button type="button" data-speed="1" title="Normal (1)">1×</button>
    <button type="button" data-speed="2" title="Snabb (2)">2×</button>
    <button type="button" data-speed="4" title="Snabbast (3)">4×</button>
  </div>
  <button type="button" class="btn" id="sprint" aria-pressed="false" title="Spring (Shift)">Spring</button>
  <button type="button" class="btn primary" id="modeBtn">Översikt</button>
  <button type="button" class="btn" id="sideBtn">Tidtabell</button>
  <button type="button" class="btn" id="menuBtn">Meny</button>
</div>
<aside id="side" class="panel closed">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="flights" aria-selected="true">Tidtabell</button>
    <button type="button" role="tab" data-tab="problems" aria-selected="false">Problem</button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>
<div id="card" class="panel" hidden></div>
<div id="help" class="panel"></div>
<div id="toasts" aria-live="polite"></div>
<div id="bubbles"></div>
<div id="modal" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/gfx.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

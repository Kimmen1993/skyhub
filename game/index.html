<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
[hidden] { display: none !important; }
/* Layout: helskärmsvärld med tecknade paneler. Status uppe till vänster, mätare i mitten, kontroller uppe till höger,
   varningar till höger, valt flyg till vänster, radio nere till vänster, menyrad i mitten, minikarta nere till höger.
   Driftcentralen öppnas som en stor panel. Medvetet ett enda ljust spel-tema. */
:root {
  --ink: #1d2433;
  --paper: #fffaf0;
  --paper-2: #f3ecdd;
  --sky: #8fd0f2;
  --coral: #e8634a;
  --sun: #f2b134;
  --teal: #2bb3a6;
  --blue: #3f6fd8;
  --violet: #8b5cf6;
  --mint: #6fd39b;
  --muted: #5d6779;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
.fx { position: fixed; }
.ico { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pill { font: 600 12px var(--font-display); padding: 1px 9px; border-radius: 999px; border: 2px solid var(--ink); white-space: nowrap; }
.ok { background: var(--mint); } .warn { background: var(--sun); } .bad { background: var(--coral); color: #fff; } .info { background: #8fd0f2; } .muted { background: #d8dde6; }
.btn { font: 700 13px var(--font-display); padding: 6px 12px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); box-shadow: 0 2px 0 var(--ink); white-space: nowrap; cursor: pointer; }
.btn.y { background: var(--sun); } .btn.t { background: var(--teal); color: #fff; } .btn.r { background: var(--coral); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, .dock button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.key { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 7px; background: var(--paper); border: 2.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); font: 700 12px var(--font-display); }

/* status */
#status { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 8px 14px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; align-items: center; }
#status .name { font: 700 16px var(--font-display); grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; max-width: 280px; }
#status .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock { font: 700 30px var(--font-display); display: flex; gap: 3px; align-items: center; }
.clock span { background: var(--ink); color: var(--paper); border-radius: 7px; padding: 0 6px; min-width: 44px; text-align: center; }
#status .meta { font-weight: 800; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
#money { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(104px + env(safe-area-inset-top, 0px)); padding: 5px 12px; font: 700 16px var(--font-display); display: flex; gap: 8px; align-items: center; }
#money.neg { color: #b8432f; }
.pop { position: fixed; font: 700 14px var(--font-display); color: #1f8a4c; background: #e3f7ea; border: 2px solid var(--ink); border-radius: 8px; padding: 0 7px; pointer-events: none; animation: popup 1.6s ease-out forwards; }
.pop.minus { color: #b8432f; background: #ffe3dc; }
@keyframes popup { from { transform: translateY(0) rotate(-4deg); opacity: 1; } to { transform: translateY(-34px) rotate(-4deg); opacity: 0; } }

/* mätare */
#kpis { left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; gap: 12px; padding: 6px 12px; }
.kpi { display: flex; gap: 7px; align-items: center; font-weight: 800; font-size: 11.5px; }
.kpi b { display: block; font: 700 16px var(--font-display); }
.ring { width: 38px; height: 38px; }
#paused { left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 3px 12px; font: 700 13px var(--font-display); background: var(--sun); }

/* kontroller */
#ctrl { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; }
.seg { display: flex; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); background: var(--paper); }
.seg button { border: 0; background: none; padding: 7px 10px; font: 700 13px var(--font-display); cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--sun); }
.tbtn { font: 700 13px var(--font-display); padding: 8px 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--paper); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
.tbtn.y { background: var(--sun); }
.tbtn[aria-pressed="true"] { background: var(--teal); color: #fff; }

/* varningar */
#alerts { right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(72px + env(safe-area-inset-top, 0px)); width: 296px; display: flex; flex-direction: column; gap: 8px; }
.alert { padding: 8px 10px 8px 13px; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; position: relative; overflow: hidden; animation: slidein 0.3s ease-out; }
@keyframes slidein { from { transform: translateX(20px); opacity: 0.3; } }
.alert::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--coral); }
.alert.y::before { background: var(--sun); } .alert.v::before { background: var(--violet); } .alert.b::before { background: var(--blue); }
.alert .ic { width: 32px; height: 32px; border-radius: 10px; border: 2.5px solid var(--ink); display: grid; place-items: center; background: #ffe3dc; grid-row: 1 / 3; }
.alert.y .ic { background: #fff3c4; } .alert.v .ic { background: #ece4ff; } .alert.b .ic { background: #dde8ff; }
.alert .t { font: 700 13.5px var(--font-display); line-height: 1.2; }
.alert .s { font-size: 12px; font-weight: 700; color: var(--muted); }
.alert .timer { grid-column: 1 / 3; height: 7px; border-radius: 4px; background: #e6e0d2; border: 1.5px solid var(--ink); overflow: hidden; }
.alert .timer i { display: block; height: 100%; background: var(--coral); }
.alert .row { grid-column: 1 / 3; display: flex; gap: 6px; flex-wrap: wrap; }
.alert .btn { padding: 4px 9px; font-size: 12px; }
.more { font: 700 12px var(--font-display); color: var(--muted); text-align: right; padding-right: 6px; }

/* valt flyg */
#flight { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(150px + env(safe-area-inset-top, 0px)); width: 300px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
#flight h3 { margin: 0; font: 700 15px var(--font-display); display: flex; gap: 7px; align-items: center; flex-wrap: wrap; padding-right: 18px; }
#flight .x { position: absolute; top: 4px; right: 8px; border: 0; background: none; font: 700 18px var(--font-display); cursor: pointer; }
#flight .sub { font-size: 12px; font-weight: 700; color: var(--muted); }
#flight .why { font-size: 12px; font-weight: 800; color: #b8432f; }
.sw { width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--ink); display: inline-block; flex: none; }
.lane { display: grid; grid-template-columns: 82px 1fr; gap: 4px 8px; align-items: center; font-size: 12px; font-weight: 800; }
.track { height: 12px; border-radius: 6px; background: #ece6d8; position: relative; border: 1.5px solid #cfc6b1; }
.track i { position: absolute; top: -1.5px; bottom: -1.5px; border-radius: 6px; border: 1.5px solid var(--ink); min-width: 4px; }
.track .nowl { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--coral); }
.track .stdl { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink); }

/* radio, hjälp, menyrad, minikarta */
#radio { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 7px 12px; display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; max-width: min(420px, calc(50% - 260px)); transition: opacity 0.6s; }
#radio em { font-style: normal; color: var(--blue); }
#radio.fade { opacity: 0.35; }
#dock { left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
#dock button { width: 80px; height: 60px; border-radius: 12px; border: 2.5px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 700 12px var(--font-display); background: var(--paper); position: relative; cursor: pointer; }
#dock button[aria-pressed="true"] { background: var(--sun); }
#dock .ico { width: 24px; height: 24px; }
#dock .bd { position: absolute; top: -9px; right: -7px; min-width: 21px; height: 21px; border-radius: 11px; background: var(--coral); color: #fff; border: 2.5px solid var(--ink); font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
#help { left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 700 12px var(--font-body); color: var(--ink); background: rgba(255, 250, 240, 0.85); border-radius: 10px; padding: 3px 10px; white-space: nowrap; pointer-events: none; }
#mini { right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 230px; height: 150px; padding: 0; overflow: hidden; cursor: pointer; }
#mini canvas { width: 100%; height: 100%; display: block; }

/* bubblor i världen */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(118px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(480px, calc(100% - 24px)); }
.toast { padding: 7px 14px; font: 600 14px var(--font-display); text-align: center; animation: tin 0.25s ease-out; }
.toast.bad { background: #ffe3dc; } .toast.good { background: #e3f7ea; } .toast.event { background: #fff3c4; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0.4; } }
.bubble { position: fixed; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; font: 600 14px var(--font-display); cursor: pointer; white-space: nowrap; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); }
.bubble .ic { width: 26px; height: 26px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 700 16px var(--font-display); border: 2px solid var(--ink); animation: pulse 1s ease-in-out infinite; }
.bubble.car .ic { background: var(--sun); color: var(--ink); font-size: 11px; animation: none; }
.bubble.near { background: var(--sun); }
.bubble .txt { display: none; }
.bubble.near .txt, .bubble:hover .txt { display: inline; }
#prompt { transform: translate(-50%, -100%); padding: 6px 12px; display: flex; gap: 8px; align-items: center; font: 700 14px var(--font-display); background: var(--sun); pointer-events: none; white-space: nowrap; }
.honk { position: fixed; transform: translate(-50%, -100%) rotate(-6deg); font: 700 15px var(--font-display); padding: 3px 9px; background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.15); } }

/* driftcentralen */
#ops { inset: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; overflow: hidden; z-index: 5; }
#opsDim { inset: 0; background: rgba(29, 36, 51, 0.35); z-index: 4; }
#ops header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 3px solid var(--ink); background: var(--paper-2); flex-wrap: wrap; }
#ops header h2 { margin: 0; font: 700 21px var(--font-display); display: flex; gap: 8px; align-items: center; }
.otabs { display: flex; gap: 6px; flex-wrap: wrap; }
.otabs button { font: 700 13px var(--font-display); padding: 6px 11px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--paper); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.otabs button[aria-pressed="true"] { background: var(--sun); }
#ops .x { margin-left: auto; font: 700 13px var(--font-display); }
#opsBody { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; -webkit-user-select: text; user-select: text; }
.note { font-weight: 700; color: var(--muted); margin: 0; line-height: 1.45; }
.sec { font: 600 12px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

.gwrap { border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; overflow-x: auto; }
.gantt { position: relative; }
.ghead, .grow { display: grid; grid-template-columns: 72px 1fr; }
.ghead { border-bottom: 2px solid var(--ink); background: var(--paper-2); font: 700 12px var(--font-display); position: sticky; top: 0; }
.ghead .hrs { position: relative; height: 26px; }
.ghead .hrs span { position: absolute; top: 5px; transform: translateX(-50%); }
.grow { border-bottom: 1.5px solid #e2dccd; height: 52px; }
.grow:last-child { border-bottom: 0; }
.grow.drop .tl { background-color: #fff3c4; }
.grow .lab { font: 700 15px var(--font-display); display: flex; flex-direction: column; justify-content: center; padding-left: 10px; border-right: 2px solid var(--ink); background: var(--paper); position: sticky; left: 0; z-index: 2; }
.grow .lab small { font: 700 10px var(--font-body); color: var(--muted); }
.grow .tl { position: relative; background-image: repeating-linear-gradient(90deg, transparent 0 59px, #efe9db 59px 60px); }
.blk { position: absolute; top: 7px; height: 36px; border-radius: 9px; border: 2.5px solid var(--ink); color: #fff; font: 700 12px var(--font-display); padding: 2px 6px; line-height: 1.2; overflow: hidden; white-space: nowrap; box-shadow: 0 2px 0 var(--ink); cursor: grab; touch-action: none; }
.blk small { display: block; font: 700 10px var(--font-body); opacity: 0.92; }
.blk.locked { cursor: default; opacity: 0.75; border-style: dashed; }
.blk.clash { outline: 3px solid var(--coral); outline-offset: 1px; }
.blk.sel { transform: translateY(-2px); box-shadow: 0 4px 0 var(--ink); outline: 3px dashed var(--ink); }
.blk.dragging { opacity: 0.85; z-index: 5; cursor: grabbing; }
.nowline { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--coral); z-index: 3; pointer-events: none; }
.infobar { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff1ea; font-weight: 800; flex-wrap: wrap; }
.infobar.okb { background: #e3f7ea; }
.infobar .g2 { flex: 1; min-width: 200px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.team { border: 2.5px solid var(--ink); border-radius: 14px; padding: 12px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
.team h3 { margin: 0; font: 700 17px var(--font-display); display: flex; gap: 8px; align-items: center; }
.faces { display: flex; flex-wrap: wrap; gap: 4px; }
.face { min-width: 34px; height: 34px; border-radius: 17px; border: 2.5px solid var(--ink); display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; font: 700 12px var(--font-display); background: var(--paper); }
.face button { border: 0; background: none; padding: 0; font: 700 13px var(--font-display); cursor: pointer; color: #b8432f; }
.bar2 { display: grid; grid-template-columns: 82px 1fr 54px; gap: 6px; align-items: center; font-size: 12px; font-weight: 800; }
.bar2 > span:nth-child(2) { height: 10px; border-radius: 5px; border: 1.5px solid var(--ink); background: #ece6d8; overflow: hidden; }
.bar2 i { display: block; height: 100%; }
.stars { color: var(--sun); letter-spacing: 1px; -webkit-text-stroke: 1px var(--ink); font-size: 14px; }
.shift { display: flex; gap: 6px; align-items: center; font-weight: 800; font-size: 13px; flex-wrap: wrap; }
.shift .btn { padding: 2px 8px; }
.cand { border: 2.5px dashed var(--ink); border-radius: 14px; padding: 10px 12px; background: var(--paper); display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 700; }
.cand b { font: 700 15px var(--font-display); }
.cand q { color: var(--muted); font-style: italic; quotes: none; }
.cand .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: #fff; font-weight: 800; font-size: 13px; }
.tbl th { text-align: left; background: var(--paper-2); font: 700 12px var(--font-display); padding: 7px 10px; border-bottom: 2px solid var(--ink); }
.tbl td { padding: 7px 10px; border-bottom: 1.5px solid #e9e3d4; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.wear { width: 100px; height: 10px; border-radius: 5px; border: 1.5px solid var(--ink); background: #ece6d8; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.wear i { display: block; height: 100%; }
.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.item { border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; }
.item b { font: 700 14px var(--font-display); }
.item .price { font: 700 15px var(--font-display); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-weight: 700; max-width: 460px; }
.kv .tot { border-top: 2px solid var(--ink); padding-top: 4px; }
.chart { display: flex; gap: 6px; align-items: flex-end; height: 120px; padding: 8px; border: 2.5px solid var(--ink); border-radius: 12px; background: #fff; max-width: 520px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 11px var(--font-display); }
.chart i { display: block; width: 100%; border: 2px solid var(--ink); border-radius: 5px 5px 0 0; }

/* dialoger */
#modal { position: fixed; inset: 0; background: rgba(29, 36, 51, 0.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dialog { width: min(560px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 12px; -webkit-user-select: text; user-select: text; }
.dialog h2 { margin: 0; font: 700 24px var(--font-display); }
.dialog h3 { margin: 4px 0 0; font: 700 16px var(--font-display); }
.dialog p, .dialog li { margin: 0; line-height: 1.55; max-width: 62ch; }
.dialog ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.dialog input, .dialog textarea { width: 100%; font: 700 18px var(--font-display); padding: 10px 12px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; }
.dialog textarea { font: 12px ui-monospace, Menlo, monospace; min-height: 80px; }
.dialog .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.dialog .btn { padding: 8px 14px; font-size: 14px; }
.cbar { display: grid; grid-template-columns: 130px 1fr 52px; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; }
.cbar i { display: block; height: 12px; border-radius: 6px; border: 2px solid var(--ink); }

@media (prefers-reduced-motion: reduce) { .bubble .ic, .toast, .alert, .pop { animation: none; } }
@media (max-width: 1100px) { #mini { width: 180px; height: 118px; } #radio { max-width: calc(50% - 230px); } }
@media (max-width: 860px) {
  #kpis { top: auto; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } .kpi span { display: none; } .ring { width: 32px; height: 32px; }
  #help, #mini, #radio { display: none; }
  #alerts { width: 240px; }
  #flight { width: 250px; }
  #dock button { width: 58px; height: 54px; font-size: 10px; }
  #ctrl .seg button { padding: 6px 7px; }
}
</style>

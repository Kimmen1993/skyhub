<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyHub stilskiss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: helskärmsscen. HUD-paneler i hörnen med samma mörka kontur som 3D-figurerna.
   Medvetet ett enda ljust spel-tema. */
:root {
  --ink: #1d2433;
  --paper: #fffaf0;
  --sky: #8fd0f2;
  --coral: #e8634a;
  --sun: #f2b134;
  --teal: #2bb3a6;
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
#hud { position: fixed; left: calc(14px + env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; max-width: calc(100% - 28px); }
#hud h1 { margin: 0; font: 700 18px var(--font-display); }
#hud .row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; font-weight: 800; font-size: 14px; }
.pill { font: 600 13px var(--font-display); padding: 2px 10px; border-radius: 999px; border: 2px solid var(--ink); }
.ok { background: #6fd39b; } .late { background: var(--coral); color: #fff; } .warn { background: var(--sun); }
#right { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: 700 15px var(--font-display); padding: 10px 16px; cursor: pointer; background: var(--sun); color: var(--ink); }
.btn.round { min-width: 46px; padding: 10px 12px; background: var(--paper); }
.btn[aria-pressed="true"] { background: var(--teal); color: #fff; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
#help { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding: 8px 14px; font-weight: 800; font-size: 13px; text-align: center; max-width: calc(100% - 28px); }
#help b { background: var(--sun); border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; }
#toast { position: fixed; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 10px 16px; font: 600 15px var(--font-display); max-width: calc(100% - 28px); text-align: center; transition: opacity 0.3s, transform 0.3s; }
#toast.hide { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }
.bubble { position: fixed; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; font: 600 14px var(--font-display); cursor: pointer; white-space: nowrap; }
.bubble .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font: 700 18px var(--font-display); border: 2px solid var(--ink); animation: pulse 1s ease-in-out infinite; }
.bubble.car .ic { background: var(--sun); color: var(--ink); animation: none; }
.bubble.near { background: var(--sun); }
.bubble .txt { display: none; }
.bubble.near .txt, .bubble:hover .txt { display: inline; }
.honk { position: fixed; transform: translate(-50%, -100%) rotate(-6deg); font: 700 16px var(--font-display); padding: 4px 10px; background: var(--sun); pointer-events: none; }
@keyframes pulse { 50% { transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .bubble .ic { animation: none; } #toast { transition: none; } }
@media (max-width: 640px) {
  #hud h1 { font-size: 15px; } #hud .row { font-size: 12px; }
  #right { top: auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  #help { font-size: 12px; }
}
</style>

<canvas id="c" aria-label="Tecknad vy av gate A1, A2 och R1"></canvas>
<div id="hud" class="panel">
  <h1>Plattan · Skiss v3</h1>
  <div class="row"><span id="clock">14:05</span><span>NV 231 → Oslo 14:35</span><span id="status" class="pill ok">I tid</span><span id="safety" class="pill ok">Säkerhet 100 %</span></div>
</div>
<div id="right">
  <button type="button" class="btn round panel" id="sprint" aria-pressed="false" title="Spring (Shift)">Spring</button>
  <button type="button" class="btn round panel" id="rotL" aria-label="Vrid kameran åt vänster">⟲</button>
  <button type="button" class="btn round panel" id="rotR" aria-label="Vrid kameran åt höger">⟳</button>
  <button type="button" class="btn panel" id="mode">Översikt</button>
</div>
<div id="help" class="panel"></div>
<div id="toast" class="panel hide" aria-live="polite"></div>
<div id="bubbles"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const T = THREE;
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const canvas = document.getElementById('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  const scene = new T.Scene();
  const HORIZON = 0xcdeefb;
  scene.background = (() => {
    const c = document.createElement('canvas'); c.width = 2; c.height = 256; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#4fa9e6'); g.addColorStop(0.65, '#a7dcf6'); g.addColorStop(1, '#cdeefb');
    x.fillStyle = g; x.fillRect(0, 0, 2, 256); const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t;
  })();
  scene.fog = new T.Fog(HORIZON, 150, 330);
  const camera = new T.PerspectiveCamera(38, 1, 0.5, 800);

  // ---------- tecknade material och former ----------
  const grad = (() => { const d = new Uint8Array([95, 95, 95, 255, 160, 160, 160, 255, 215, 215, 215, 255, 255, 255, 255, 255]); const t = new T.DataTexture(d, 4, 1, T.RGBAFormat); t.minFilter = t.magFilter = T.NearestFilter; t.needsUpdate = true; return t; })();
  const mats = {};
  const toon = (c) => mats[c] || (mats[c] = new T.MeshToonMaterial({ color: c, gradientMap: grad }));
  const inkMat = new T.MeshBasicMaterial({ color: 0x1d2433, side: T.BackSide });
  const OL = 0.055;
  const geos = {};
  function rboxGeo(w, h, d, r) {
    const key = [w, h, d, r].join('|'); if (geos[key]) return geos[key];
    r = Math.max(0.002, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01));
    const b = r * 0.6, rc = Math.max(0.001, r - b), W = w - 2 * b, H = h - 2 * b;
    const s = new T.Shape();
    s.moveTo(-W / 2 + rc, -H / 2); s.lineTo(W / 2 - rc, -H / 2); s.quadraticCurveTo(W / 2, -H / 2, W / 2, -H / 2 + rc);
    s.lineTo(W / 2, H / 2 - rc); s.quadraticCurveTo(W / 2, H / 2, W / 2 - rc, H / 2); s.lineTo(-W / 2 + rc, H / 2);
    s.quadraticCurveTo(-W / 2, H / 2, -W / 2, H / 2 - rc); s.lineTo(-W / 2, -H / 2 + rc); s.quadraticCurveTo(-W / 2, -H / 2, -W / 2 + rc, -H / 2);
    const g = new T.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * b), bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 2, curveSegments: 4 });
    g.translate(0, 0, -(d - 2 * b) / 2); g.computeVertexNormals();
    return (geos[key] = g);
  }
  function finish(m, parent, outlineGeo) {
    m.castShadow = true; m.receiveShadow = true;
    if (outlineGeo) m.add(new T.Mesh(outlineGeo, inkMat));
    (parent || scene).add(m); return m;
  }
  const rr = (w, h, d) => Math.min(w, h, d) * 0.18;
  const rbox = (w, h, d, col, parent, r, ol) => { r = r == null ? rr(w, h, d) : r; return finish(new T.Mesh(rboxGeo(w, h, d, r), toon(col)), parent, ol === false ? null : rboxGeo(w + OL * 2, h + OL * 2, d + OL * 2, r + OL)); };
  const cyl = (rt, rb, h, col, parent, seg, ol) => finish(new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 20), toon(col)), parent, ol === false ? null : new T.CylinderGeometry(rt + OL, rb + OL, h + OL * 2, seg || 20));
  const cone = (r, h, col, parent, seg) => finish(new T.Mesh(new T.ConeGeometry(r, h, seg || 16), toon(col)), parent, new T.ConeGeometry(r + OL, h + OL * 2, seg || 16));
  const sph = (r, col, parent, ol) => finish(new T.Mesh(new T.SphereGeometry(r, 20, 14), toon(col)), parent, ol === false ? null : new T.SphereGeometry(r + OL, 20, 14));
  const at = (m, x, y, z) => (m.position.set(x, y, z), m);
  const group = (x, z, rot, parent) => { const g = new T.Group(); g.position.set(x, 0, z); g.rotation.y = rot || 0; (parent || scene).add(g); return g; };
  function tex(draw, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4; return t;
  }
  const textTex = (text, w, h, bg, fg, font) => tex((x) => { if (bg) { x.fillStyle = bg; x.fillRect(0, 0, w, h); } x.fillStyle = fg; x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, h / 2 + 4); }, w, h);
  function decal(texture, w, h, parent, transparent) {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ map: texture, transparent: !!transparent }));
    (parent || scene).add(m); return m;
  }

  // ---------- ljus ----------
  scene.add(new T.HemisphereLight(0xe3f4ff, 0x9bc88a, 0.6));
  const sun = new T.DirectionalLight(0xfff0d0, 1.0);
  sun.position.set(-60, 85, -40); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 70, bottom: -70, near: 1, far: 260 }); sun.shadow.camera.updateProjectionMatrix();
  sun.target.position.set(-20, 0, -15); scene.add(sun.target);
  sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02;
  scene.add(sun);

  // ---------- layout ----------
  // Människor är ca 1,9 enheter höga, planen ca 27 enheter långa (ca 14 gånger).
  const PS = 1.15;                // planskala
  const PY = 3.85 * PS;           // flygkroppens höjd
  const NOSE = 12.95;             // nos framför planets mitt
  const STOP_Z = -5.6;            // stopplinje
  const PLANE_Z = STOP_Z - NOSE;  // planets mitt i z
  const GATES = [{ x: -50, name: 'A1', contact: true }, { x: -14, name: 'A2', contact: true }, { x: 26, name: 'R1', contact: false }];
  const X0 = -84, X1 = 48;        // plattans kanter
  const BOUND = { x0: X0 + 2, x1: X1 - 2, z0: -42, z1: -0.6 };
  const ROAD_Z = -1.4;

  // ---------- mark ----------
  const flat = (w, d, x, z, col, y) => { const m = new T.Mesh(new T.PlaneGeometry(w, d), toon(col)); m.rotation.x = -Math.PI / 2; m.position.set(x, y || 0.02, z); m.receiveShadow = true; scene.add(m); return m; };
  flat(800, 800, 0, 0, 0x86c96a, 0);
  for (let x = -300; x < 300; x += 16) flat(8, 800, x + 4, 0, 0x7cbf61, 0.005);
  const apronTex = tex((x, w, h) => { x.fillStyle = '#d9dee5'; x.fillRect(0, 0, w, h); x.strokeStyle = '#c5ccd6'; x.lineWidth = 3; for (let i = 0; i <= 22; i++) { x.beginPath(); x.moveTo(i * w / 22, 0); x.lineTo(i * w / 22, h); x.stroke(); } for (let i = 0; i <= 7; i++) { x.beginPath(); x.moveTo(0, i * h / 7); x.lineTo(w, i * h / 7); x.stroke(); } }, 1408, 448);
  const apron = new T.Mesh(new T.PlaneGeometry(X1 - X0, 44), new T.MeshToonMaterial({ map: apronTex, gradientMap: grad })); apron.rotation.x = -Math.PI / 2; apron.position.set((X0 + X1) / 2, 0.02, -22); apron.receiveShadow = true; scene.add(apron);
  flat(220, 7, -18, -50, 0x535b6e, 0.03); flat(220, 0.35, -18, -50, 0xf2b134, 0.05);
  for (let x = X0 + 2; x <= X1 - 2; x += 3) flat(0.25, 0.9, x, -45.6, 0xe8634a, 0.05);
  flat(320, 13, -18, -68, 0x474e60, 0.03);
  for (let x = -160; x <= 130; x += 10) flat(5, 0.5, x, -68, 0xffffff, 0.05);
  flat(X1 - X0, 2.6, (X0 + X1) / 2, ROAD_Z, 0x6b7489, 0.03); for (let x = X0 + 2; x <= X1 - 2; x += 4) flat(2, 0.18, x, ROAD_Z, 0xffffff, 0.05);
  flat(X1 - X0, 0.2, (X0 + X1) / 2, -2.8, 0xe8634a, 0.05);
  for (let i = 0; i < 6; i++) flat(0.8, 2.4, 10 + i * 1.6, ROAD_Z, 0xffffff, 0.06);
  flat(150, 6, -18, 32, 0x535b6e, 0.02);

  // ---------- terminal (A1–A2) ----------
  const TX = -32, TW = 80;
  const term = group(TX, 10);
  at(rbox(TW, 10.5, 20, 0xf4efe6, term, 0.6), 0, 5.25, 0);
  at(rbox(TW - 6, 5.6, 0.7, 0x7fd3f0, term, 0.25), 0, 5.6, -10.1);
  const finCols = [0x2bb3a6, 0xe8634a, 0xf2b134, 0x3f6fd8];
  for (let i = 0, x = -TW / 2 + 3; x <= TW / 2 - 3; x += 4, i++) at(rbox(0.7, 7, 1.3, i % 4 === 1 ? finCols[(i >> 2) % 4] : 0x2e3a52, term, 0.2, i % 4 === 1), x, 5.5, -10.2);
  at(rbox(TW + 2, 0.9, 1.6, 0x2e3a52, term, 0.3), 0, 9.1, -10.3);
  at(rbox(TW + 4, 1.2, 23, 0x2e3a52, term, 0.5), 0, 11.1, 0);
  for (let x = -TW / 2 + 6; x <= TW / 2 - 6; x += 8) { const p = at(rbox(6, 0.3, 4, 0x27406e, term, 0.08), x, 12.1, 4); p.rotation.x = -0.25; }
  for (const x of [-24, -2, 20]) { at(rbox(3, 1.6, 3, 0xc3cad4, term, 0.4), x, 12.5, -4); at(cyl(0.8, 0.8, 0.4, 0x9aa3b0, term, 16), x, 13.4, -4); }
  at(rbox(22, 3, 1.2, 0x2e3a52, term, 0.5), 0, 13.6, -8);
  const nameSign = decal(textTex('SKYHUB', 880, 120, '#2e3a52', '#f2b134', '700 96px Fredoka, sans-serif'), 20.5, 2.6, term);
  nameSign.position.set(0, 13.6, -8.65); nameSign.rotation.y = Math.PI;
  const BAG_X = -32;
  at(rbox(5, 3.2, 0.6, 0x3c4a63, term, 0.3), BAG_X - TX, 1.6, -10.1);
  const ads = [['NORDVIND', 'Oslo på 59 min', '#3f6fd8', -66], ['TAX FREE', '−20 % på allt', '#e8634a', -22], ['FJÄLLFLYG', 'Hem till fjällen', '#2bb3a6', -2]];
  ads.forEach(([a, b, bg, ax]) => {
    const t = tex((x, w, h) => { x.fillStyle = bg; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.textAlign = 'center'; x.font = '700 70px Fredoka, sans-serif'; x.fillText(a, w / 2, 86); x.font = '600 40px Nunito, sans-serif'; x.fillText(b, w / 2, 150); }, 512, 200);
    at(rbox(9.4, 3.9, 0.4, 0x2e3a52, term, 0.2), ax - TX, 2.3, -10.6);
    const d = decal(t, 9, 3.5, term); d.position.set(ax - TX, 2.3, -10.82); d.rotation.y = Math.PI;
  });
  // flaggor
  const flags = [];
  [0x3f6fd8, 0xe8634a, 0x2bb3a6, 0xf2b134].forEach((c, i) => {
    at(cyl(0.12, 0.12, 9, 0xd0d6de, scene, 8), 36 + i * 2.5, 4.5, 3);
    flags.push(at(rbox(2, 1.2, 0.08, c, scene, 0.04), 37.1 + i * 2.5, 8.2, 3));
  });

  // ---------- kollisioner (fylls på av allt som byggs) ----------
  const boxes = [], circles = [];
  const addBox = (x, z, hw, hd, rot) => boxes.push({ x, z, hw, hd, rot: rot || 0 });

  // ---------- flygplan ----------
  function plane(livery, accent, code) {
    const g = new T.Group();
    const body = cyl(2.1, 2.1, 16, 0xffffff, g, 24); body.rotation.x = Math.PI / 2;
    const nose = sph(2.1, 0xffffff, g); nose.scale.set(1, 0.95, 1.55); nose.position.z = 8;
    const tail = cone(2.1, 7, 0xffffff, g, 24); tail.rotation.x = -Math.PI / 2; tail.position.set(0, 0.5, -11.4); tail.scale.set(1, 1, 0.7);
    at(rbox(2.6, 0.7, 1.2, 0x2e3a52, g, 0.3), 0, 1.0, 10.2).rotation.x = 0.5;
    const belly = new T.Mesh(new T.CylinderGeometry(2.12, 2.12, 15.6, 24, 1, true, -Math.PI * 0.38, Math.PI * 0.76), new T.MeshToonMaterial({ color: livery, gradientMap: grad, side: T.DoubleSide }));
    belly.rotation.x = Math.PI / 2; g.add(belly);
    for (const sx of [1, -1]) {
      at(rbox(0.3, 0.45, 17, accent, g, 0.12, false), sx * 2.08, -0.25, 0.2);
      for (let z = -6.5; z <= 6.5; z += 1.3) { const w = sph(0.26, 0x2e3a52, g, false); w.position.set(sx * 2.03, 0.65, z); w.scale.set(0.4, 1, 1); }
      const wing = at(rbox(12, 0.55, 4.4, 0xeef1f5, g, 0.25), sx * 7.6, -0.9, -0.4); wing.rotation.y = sx * 0.28;
      at(rbox(0.4, 1.6, 1.4, livery, g, 0.15), sx * 13.4, -0.2, -2.3);
      const eng = cyl(1.15, 1.0, 3.4, livery, g); eng.rotation.x = Math.PI / 2; eng.position.set(sx * 5, -2.1, 1.6);
      const lip = cyl(1.18, 1.18, 0.4, 0xd9dee6, g, 20, false); lip.rotation.x = Math.PI / 2; lip.position.set(sx * 5, -2.1, 3.25);
      const inl = cyl(0.85, 0.85, 0.2, 0x2e3a52, g, 20, false); inl.rotation.x = Math.PI / 2; inl.position.set(sx * 5, -2.1, 3.4);
      const hs = at(rbox(5.4, 0.4, 2.4, 0xeef1f5, g, 0.18), sx * 3.2, 1.2, -12.4); hs.rotation.y = sx * 0.3;
      const gear = cyl(0.25, 0.25, 1.6, 0x6b7489, g, 8, false); gear.position.set(sx * 2.2, -2.6, -0.8);
      const wh = cyl(0.7, 0.7, 0.6, 0x2a2f3a, g, 16); wh.rotation.z = Math.PI / 2; wh.position.set(sx * 2.2, -3.2, -0.8);
    }
    const fin = at(rbox(0.6, 6.4, 4.6, livery, g, 0.25), 0, 4.2, -11.6); fin.rotation.x = -0.4;
    const logo = textTex(code, 256, 256, null, '#' + accent.toString(16).padStart(6, '0'), '700 150px Fredoka, sans-serif');
    for (const sx of [1, -1]) { const d = decal(logo, 3.2, 3.2, fin, true); d.position.set(sx * 0.32, 0.4, 0); d.rotation.y = sx * Math.PI / 2; }
    const ng = cyl(0.2, 0.2, 1.6, 0x6b7489, g, 8, false); ng.position.set(0, -2.6, 7);
    const nw = cyl(0.55, 0.55, 0.5, 0x2a2f3a, g, 16); nw.rotation.z = Math.PI / 2; nw.position.set(0, -3.3, 7);
    g.traverse((o) => { if (o.isMesh && o.material !== inkMat) o.castShadow = true; });
    g.scale.setScalar(PS);
    scene.add(g); return g;
  }

  // ---------- gate: markering, plan, brygga eller trappa, kottar ----------
  const occluders = [term];
  const liveries = { A1: [0xe8634a, 0xffffff, 'SC'], A2: [0x3f6fd8, 0xf2b134, 'NV'], R1: [0x2bb3a6, 0xffffff, 'FJ'] };
  const gateRefs = {};
  GATES.forEach((G) => {
    const gx = G.x;
    flat(0.4, 26, gx, -25, 0xf2b134, 0.04); flat(6, 0.4, gx, STOP_Z, 0xf2b134, 0.045);
    for (const sx of [-1, 1]) flat(0.3, 34, gx + sx * 17, -20, 0xe8634a, 0.04);
    flat(34, 0.3, gx, -37, 0xe8634a, 0.04);
    const n = decal(textTex(G.name, 256, 128, null, '#f2b134', '700 110px Fredoka, sans-serif'), 4, 2, scene, true);
    n.rotation.x = -Math.PI / 2; n.rotation.z = Math.PI; n.position.set(gx, 0.06, -39);
    const [liv, acc, code] = liveries[G.name];
    const p = plane(liv, acc, code); p.position.set(gx, PY, PLANE_Z); occluders.push(p);

  const nearP = (p, r) => Math.hypot(me().x - p.x, me().z - p.z) < (r || (driving ? 5.5 : 4.2));
  function tryFix(fromClick) {
    if (!active) return false;
    const p = problems[active.id].pos();
    if (nearP(p)) {
      if (driving && Math.abs(carS.v) > 1.5) { toast('Stanna bilen först.'); return true; }
      toast(problems[active.id].done);
      if (active.id === 'lost') lostWalk = V(-60, 0, -0.8);
      active.el.remove(); lastProb = active.id; active = null; nextIn = 6 + Math.random() * 4;
      burst(V(p.x, 2.5, p.z));
      return true;
    } else if (fromClick) { target = V(p.x, 0, p.z); setMode(0); }
    return false;
  }
  const stars = [];
  function burst(p) {
    for (let i = 0; i < 12; i++) {
      const s = sph(0.2, i % 2 ? 0xf2b134 : 0xffffff, scene, false); s.position.copy(p);
      stars.push({ m: s, v: V((Math.random() - 0.5) * 8, 6 + Math.random() * 4, (Math.random() - 0.5) * 8), life: 1 });
    }
  }
  let toastT = 0;
  function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.remove('hide'); toastT = 3.2; }

  // ---------- fordon som stannar och tutar ----------
  const honks = [];
  function vehicleBlocked(pos, dir, v) {
    const m = me(), dx = m.x - pos.x, dz = m.z - pos.z;
    const ahead = dx * dir.x + dz * dir.z, side = Math.abs(dx * dir.z - dz * dir.x);
    const blocked = ahead > 0 && ahead < (driving ? 7 : 4.5) && side < (driving ? 2.6 : 2.0);
    if (blocked && !v.honking) {
      v.honking = true; safety = Math.max(0, safety - 4);
      const el = document.createElement('div'); el.className = 'honk panel'; el.textContent = 'TUUT!'; document.body.appendChild(el);
      const p0 = pos.clone(); honks.push({ el, pos: () => p0.clone(), life: 1.4 });
      if (!v.warned) { v.warned = true; toast('Akta! Fordon på plattan har företräde. Säkerhetsbetyget sjunker.'); }
    }
    if (!blocked) v.honking = false;
    return blocked;
  }

  // ---------- kamera och styrning ----------
  let mode = 0, modeK = 0, yaw = 0, yawTarget = 0, dist = 15, sprintToggle = false;
  const btn = document.getElementById('mode'), sprintBtn = document.getElementById('sprint');
  function setMode(m) { mode = m; btn.textContent = m ? 'Gå ner på golvet' : 'Översikt'; }
  btn.addEventListener('click', () => setMode(mode ? 0 : 1));
  sprintBtn.addEventListener('click', () => { sprintToggle = !sprintToggle; sprintBtn.setAttribute('aria-pressed', String(sprintToggle)); });
  document.getElementById('rotL').addEventListener('click', () => (yawTarget += Math.PI / 4));
  document.getElementById('rotR').addEventListener('click', () => (yawTarget -= Math.PI / 4));
  const keys = new Set();
  function action() {
    if (tryFix(false)) return;
    if (driving) { if (Math.abs(carS.v) > 1.5) { toast('Stanna bilen först.'); return; } exitCar(); return; }
    if (nearP(carS, 3.6)) enterCar();
  }
  function enterCar() { driving = true; manager.visible = false; target = null; toast('Du sitter i Follow me-bilen. Kör lugnt nära planen.'); }
  function exitCar() {
    driving = false; manager.visible = true; target = null;
    manager.position.set(carS.x - Math.cos(carS.h) * 2.2, 0, carS.z + Math.sin(carS.h) * 2.2); collide(manager.position, [], 0.45);
  }
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase(); keys.add(k);
    if (k === 'f' || k === ' ') { e.preventDefault(); action(); }
    if (k === 'tab' || k === 'o') { e.preventDefault(); setMode(mode ? 0 : 1); }
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());
  let target = null;
  const ray = new T.Raycaster(), groundPlane = new T.Plane(V(0, 1, 0), 0);
  const ptrs = new Map(); let drag = null, pinch = 0;
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); drag = { x: e.clientX, y: e.clientY, lx: e.clientX, moved: false }; });
  canvas.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) dist = Math.max(8, Math.min(40, dist * pinch / d)); pinch = d; drag = null; return; }
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) drag.moved = true;
    if (drag.moved) { yawTarget -= (e.clientX - drag.lx) * 0.008; yaw = yawTarget; }
    drag.lx = e.clientX;
  });
  canvas.addEventListener('pointerup', (e) => {
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0;
    if (!drag || drag.moved || e.button !== 0) { drag = null; return; }
    drag = null;
    ray.setFromCamera(new T.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    const p = V(0, 0, 0); if (!ray.ray.intersectPlane(groundPlane, p)) return;
    p.x = Math.max(BOUND.x0, Math.min(BOUND.x1, p.x)); p.z = Math.max(BOUND.z0, Math.min(BOUND.z1, p.z));
    if (mode === 1) {
      if (driving) exitCar();
      manager.position.set(p.x, 0, p.z); collide(manager.position, [], 0.45); target = null; setMode(0); burst(V(p.x, 1, p.z));
    } else if (!driving && nearP(carS, 3.6) && Math.hypot(p.x - carS.x, p.z - carS.z) < 3) enterCar();
    else target = p;
  });
  canvas.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); drag = null; pinch = 0; });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.max(8, Math.min(40, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  window.addEventListener('resize', resize); resize();

  // bubbla över bilen
  const carBubble = document.createElement('div'); carBubble.className = 'bubble panel car'; carBubble.innerHTML = '<span class="ic">FM</span><span class="txt">Kliv in (F)</span>';
  carBubble.addEventListener('click', (e) => { e.stopPropagation(); if (nearP(carS, 3.6)) enterCar(); else { target = V(carS.x, 0, carS.z); setMode(0); } });
  document.getElementById('bubbles').appendChild(carBubble);
  carBubble.querySelector('.ic').style.fontSize = '12px';

  // ---------- loop ----------
  let last = performance.now(), clock = 14 * 60 + 5, trainD = 0, vanX = 40, vanDir = -1;
  const pathLen = (pts) => pts.slice(1).reduce((a, p, i) => a + p.distanceTo(pts[i]), 0);
  const along = (pts, d) => { for (let i = 1; i < pts.length; i++) { const L = pts[i].distanceTo(pts[i - 1]); if (d <= L) return { p: pts[i - 1].clone().lerp(pts[i], d / L), dir: pts[i].clone().sub(pts[i - 1]).normalize() }; d -= L; } return { p: pts[pts.length - 1].clone(), dir: pts[pts.length - 1].clone().sub(pts[pts.length - 2]).normalize() }; };
  const tLen = pathLen(trainPath), cycle = tLen * 2 + 10, paxLen = pathLen(paxPath);
  const trainState = {}, vanState = {};
  const camPos = V(0, 0, 0), camLook = V(0, 0, 0);
  const helpEl = document.getElementById('help');
  let helpLast = '';

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    clock += dt;

    if (keys.has('q')) yawTarget += dt * 1.8;
    if (keys.has('e')) yawTarget -= dt * 1.8;
    if (driving && Math.abs(carS.v) > 2 && !keys.has('q') && !keys.has('e') && !(drag && drag.moved)) {
      let d = carS.h - yawTarget; d = Math.atan2(Math.sin(d), Math.cos(d)); yawTarget += d * Math.min(1, dt * 1.5);
    }
    yaw += (yawTarget - yaw) * Math.min(1, dt * 8);
    const fwd = V(Math.sin(yaw), 0, Math.cos(yaw)), right = V(-Math.cos(yaw), 0, Math.sin(yaw));

    // fordon som rör sig
    const dyn = [];
    const forward = trainD < tLen + 5;
    const legD = trainD < tLen ? trainD : trainD < tLen + 5 ? tLen : trainD < cycle - 5 ? cycle - 5 - trainD : 0;
    const head = along(trainPath, forward ? legD : Math.max(0, legD - 3 * 2.4)), hdir = forward ? head.dir.clone() : head.dir.clone().negate();
    const stuck = active && active.id === 'cart';
    const blockedT = vehicleBlocked(head.p, hdir, trainState);
    if (!stuck && !blockedT) trainD = (trainD + dt * 4) % cycle;
    cars.forEach((c, i) => { const a = along(trainPath, Math.max(0, legD - i * 2.4)); c.position.copy(a.p); c.rotation.y = Math.atan2(a.dir.x, a.dir.z); if (stuck && i === 0) c.position.y = Math.abs(Math.sin(t * 20)) * 0.08; dyn.push({ x: a.p.x, z: a.p.z, hw: 0.85, hd: 1.1, rot: c.rotation.y }); });
    const vdir = V(vanDir, 0, 0), vpos = V(vanX, 0, ROAD_Z);
    const trainAhead = cars.some((c) => { const dx = c.position.x - vanX; return dx * vanDir > 0 && Math.abs(dx) < 6 && Math.abs(c.position.z - ROAD_Z) < 2.4; });
    if (!vehicleBlocked(vpos, vdir, vanState) && !trainAhead) { vanX += vanDir * dt * 6; if (vanX < X0 + 4 || vanX > X1 - 4) vanDir *= -1; }
    van.position.set(vanX, 0, ROAD_Z); van.rotation.y = vanDir > 0 ? Math.PI / 2 : -Math.PI / 2;
    dyn.push({ x: vanX, z: ROAD_Z, hw: 1.9, hd: 1.0, rot: 0 });

    // input-riktning
    let mv = V(0, 0, 0);
    if (keys.has('w') || keys.has('arrowup')) mv.add(fwd);
    if (keys.has('s') || keys.has('arrowdown')) mv.sub(fwd);
    if (keys.has('a') || keys.has('arrowleft')) mv.sub(right);
    if (keys.has('d') || keys.has('arrowright')) mv.add(right);
    const sprint = keys.has('shift') || sprintToggle;

    if (driving) {
      // Bilen: W/S gas och broms, A/D styr. Klick på marken = kör dit.
      let thr = 0, steer = 0;
      const kW = keys.has('w') || keys.has('arrowup'), kS = keys.has('s') || keys.has('arrowdown');
      const kA = keys.has('a') || keys.has('arrowleft'), kD = keys.has('d') || keys.has('arrowright');
      if (kW || kS || kA || kD) { target = null; thr = (kW ? 1 : 0) - (kS ? 1 : 0); steer = (kA ? 1 : 0) - (kD ? 1 : 0); }
      else if (target && mode === 0) {
        const dx = target.x - carS.x, dz = target.z - carS.z, d = Math.hypot(dx, dz);
        if (d < 2.5) { target = null; } else { let a = Math.atan2(dx, dz) - carS.h; a = Math.atan2(Math.sin(a), Math.cos(a)); steer = Math.max(-1, Math.min(1, a * 2)); thr = d > 8 ? 1 : 0.5; }
      }
      const maxV = 15;
      if (thr > 0) carS.v = Math.min(maxV, carS.v + 9 * dt * thr);
      else if (thr < 0) carS.v = Math.max(-5, carS.v - (carS.v > 0 ? 18 : 6) * dt);
      else carS.v *= Math.pow(0.25, dt);
      if (target === null && thr === 0 && Math.abs(carS.v) < 0.2) carS.v = 0;
      carS.h += steer * dt * Math.min(1, Math.abs(carS.v) / 4) * 1.9 * Math.sign(carS.v || 1);
      const p = V(carS.x + Math.sin(carS.h) * carS.v * dt, 0, carS.z + Math.cos(carS.h) * carS.v * dt);
      const before = p.clone(); collide(p, dyn, 1.5);
      if (before.distanceTo(p) > 0.02) carS.v *= 0.5;
      carS.x = p.x; carS.z = p.z;
      // trafikregel: för fort nära flygplan
      speedWarnT -= dt;
      if (Math.abs(carS.v) > 7 && distToPlane(carS.x, carS.z) < 5 && speedWarnT <= 0) { safety = Math.max(0, safety - 3); speedWarnT = 3; toast('För fort nära flygplanet! Max gångfart inom säkerhetsrutan.'); }
    } else {
      if (mv.lengthSq()) { target = null; mv.normalize(); }
      else if (target) { mv = target.clone().sub(manager.position); mv.y = 0; if (mv.length() < 0.4) { target = null; mv.set(0, 0, 0); } else mv.normalize(); }
      const speed = mv.lengthSq() > 0 && mode === 0 ? (sprint ? 9.5 : 5) : 0;
      if (speed) {
        const before = manager.position.clone();
        manager.position.addScaledVector(mv, speed * dt);
        collide(manager.position, dyn.concat([{ x: carS.x, z: carS.z, hw: 1.0, hd: 2.1, rot: carS.h }]), 0.45);
        if (target && manager.position.distanceTo(before) < speed * dt * 0.15) target = null;
        const want = Math.atan2(mv.x, mv.z); let d = want - manager.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); manager.rotation.y += d * Math.min(1, dt * 12);
      } else collide(manager.position, dyn, 0.45);
      animate(manager, speed, dt);
    }
    car.position.set(carS.x, 0, carS.z); car.rotation.y = carS.h;
    carBeacon.visible = driving ? Math.sin(t * 8) > 0 : false;

    // personal och passagerare
    crew.forEach((c, i) => {
      if (i === 2) { const a = t * 0.5; c.position.copy(c.home).add(V(Math.cos(a) * 2.2, 0, Math.sin(a) * 2.2)); c.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)); animate(c, 4, dt); }
      else { c.rotation.y = Math.sin(t * 0.7 + i) * 0.6 + Math.PI; animate(c, 0, dt); if (active && active.id === 'fuel' && i === 1) c.userData.arms[0].rotation.x = -2.6 + Math.sin(t * 8) * 0.4; }
    });
    pax.forEach((p) => {
      p.t = (p.t + dt * 0.04) % 1;
      const a = along(paxPath, p.t * paxLen);
      p.position.copy(a.p); p.rotation.y = Math.atan2(a.dir.x, a.dir.z); p.userData.baseY = a.p.y; animate(p, 4, dt); p.visible = p.t < 0.97;
    });
    if (lost.visible) {
      if (lostWalk) {
        const d = lostWalk.clone().sub(lost.position); d.y = 0;
        if (d.length() < 0.5) { lost.visible = false; lostWalk = null; }
        else { d.normalize(); lost.position.addScaledVector(d, 4 * dt); lost.rotation.y = Math.atan2(d.x, d.z); animate(lost, 4, dt); }
      } else { lost.rotation.y = t * 1.2; animate(lost, 0, dt); }
    }
    pTaxi.position.set(140 - ((t * 0.025) % 1) * 300, PY * 0.9, -50); pTaxi.rotation.y = -Math.PI / 2; pTaxi.scale.setScalar(PS * 0.9);
    clouds.forEach((c, i) => { c.position.x += dt * (1 + (i % 3) * 0.4); if (c.position.x > 220) c.position.x = -220; });
    flags.forEach((f, i) => (f.rotation.y = Math.sin(t * 3 + i) * 0.25));
    beacon.visible = Math.sin(t * 4) > 0;

    // problem
    if (!active) { nextIn -= dt; if (nextIn <= 0) { const ids = Object.keys(problems).filter((k) => k !== lastProb); activate(ids[Math.floor(Math.random() * ids.length)]); } }
    else { active.since += dt; if (active.since > 15 && Math.floor(active.since / 4) !== Math.floor((active.since - dt) / 4)) delay++; }
    const st = document.getElementById('status'); st.textContent = delay ? `Försenad +${delay} min` : 'I tid'; st.className = 'pill ' + (delay ? 'late' : 'ok');
    const sf = document.getElementById('safety'); sf.textContent = `Säkerhet ${safety} %`; sf.className = 'pill ' + (safety >= 90 ? 'ok' : safety >= 70 ? 'warn' : 'late');
    document.getElementById('clock').textContent = String(Math.floor(clock / 60) % 24).padStart(2, '0') + ':' + String(Math.floor(clock % 60)).padStart(2, '0');

    for (let i = stars.length - 1; i >= 0; i--) { const s = stars[i]; s.v.y -= 18 * dt; s.m.position.addScaledVector(s.v, dt); s.life -= dt; s.m.scale.setScalar(Math.max(0.01, s.life)); if (s.life <= 0) { scene.remove(s.m); stars.splice(i, 1); } }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) document.getElementById('toast').classList.add('hide'); }

    // hjälptext efter läge
    let help;
    if (mode === 1) help = 'Översikt: klicka där du vill hoppa ner · Q/E eller dra: vrid';
    else if (driving) help = 'Kör: W/S gas och broms · A/D styr · klicka på marken för att köra dit · <b>F</b> kliv ur';
    else help = 'Gå: WASD eller klicka · <b>Shift</b> spring · Q/E eller dra: vrid · scrolla: zooma · <b>F</b> hjälp till' + (nearP(carS, 3.6) ? ' · <b>F</b> kliv in i bilen' : '');
    if (help !== helpLast) { helpEl.innerHTML = help; helpLast = help; }

    // kamera
    modeK += ((mode ? 1 : 0) - modeK) * Math.min(1, dt * 3);
    const mp = me(), cd = driving ? dist * 1.35 : dist;
    const floorPos = V(mp.x - fwd.x * cd, cd * 0.66 + 1, mp.z - fwd.z * cd), floorLook = V(mp.x + fwd.x * 2.5, 1.5, mp.z + fwd.z * 2.5);
    const oc = V(-18, 0, -18), overPos = V(oc.x - fwd.x * 135, 105, oc.z - fwd.z * 135);
    camPos.copy(floorPos).lerp(overPos, modeK); camLook.copy(floorLook).lerp(oc, modeK);
    camera.position.lerp(camPos, Math.min(1, dt * 7)); camera.lookAt(camLook);

    const headPos = mp.clone().add(V(0, 1.6, 0)), dirC = headPos.clone().sub(camera.position), L = dirC.length();
    ray.set(camera.position, dirC.normalize()); ray.far = Math.max(0.1, L - 1.5);
    const hit = new Set();
    if (modeK < 0.5) ray.intersectObjects(occluders, true).forEach((h) => { let o = h.object; while (o.parent && !occluders.includes(o)) o = o.parent; if (!(driving && o === car)) hit.add(o); });
    occluders.forEach((g) => { const want = hit.has(g) ? 0.22 : 1; if (Math.abs(g.userData.alpha - want) > 0.01) { g.userData.alpha += (want - g.userData.alpha) * Math.min(1, dt * 8); setAlpha(g, g.userData.alpha); } });

    // bubblor
    const place = (el, p) => { const s = p.project(camera); el.style.left = ((s.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - s.y) / 2 * innerHeight) + 'px'; el.hidden = s.z > 1; };
    if (active) { place(active.el, problems[active.id].pos().add(V(0, 4.4, 0))); active.el.classList.toggle('near', nearP(problems[active.id].pos())); }
    carBubble.hidden = driving; if (!driving) { place(carBubble, V(carS.x, 4, carS.z)); carBubble.classList.toggle('near', nearP(carS, 3.6)); }
    for (let i = honks.length - 1; i >= 0; i--) { const h = honks[i]; h.life -= dt; place(h.el, h.pos().add(V(0, 3.2, 0))); if (h.life <= 0) { h.el.remove(); honks.splice(i, 1); } }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  camera.position.set(-20, 12, -24);
  requestAnimationFrame(frame);
})();
</script>
